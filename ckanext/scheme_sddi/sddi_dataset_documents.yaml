scheming_version: 2
dataset_type: dataset_documents
about: "SDDI Dataset and Documents metadata schema"
about_url: https://github.com/MarijaKnezevic/ckanext-scheme-sddi

dataset_fields:
# ============================================================
# BASE FIELDS — InformationResource (adapted from sddi_dataset.yaml style)
# ============================================================

  - field_name: title
    label:
      en: Title
      de: Titel
    preset: title
    form_placeholder: eg. A descriptive title

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: notes
    label:
      en: Description
      de: Beschreibung
    required: True
    validators: scheming_required
    form_snippet: markdown.html
    form_placeholder: eg. Some useful notes about the data

  - field_name: tag_string
    label: Tags
    required: True
    preset: tag_string_autocomplete
    validators: required_tags tag_string_convert
    form_placeholder: eg. economy, mental health, government
    help_text:
      en: Tags help others find this entry in the catalogue.
      de: Über Tags können Katalogeinträge besser gefunden werden. Ein Tag ist ein Wort, welches im Zusammenhang mit dem Eintrag steht.

  - field_name: license_id
    label:
      en: License
      de: Lizenz
    required: True
    validators: scheming_required
    form_snippet: license.html
    help_text:
      en: License definitions and additional information can be found at http://opendefinition.org/
      de: Es wird empfohlen Creative Commons Zero oder Creative Commons Namensnennung für offene Daten zu nutzen. Mehr Infos http://opendefinition.org/

  - field_name: language
    label:
      en: Language
      de: Sprache
    validators: ignore_missing
    preset: select
    choices:
      - value: de
        label: Deutsch
      - value: en
        label: English
    help_text:
      en: Language in which this catalogue entry is written.
      de: Legt fest in welcher Sprache der Katalogeintrag verfasst ist.

  - field_name: author
    label: Author
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: author_name
        label:
          en: Author Name
          de: Name des Autors
        required: True
        validators: scheming_required
        form_placeholder: Joe Bloggs

      - field_name: author_email
        label:
          en: Author Email
          de: E-Mail des Autors
        form_placeholder: joe@example.com

  - field_name: maintainer
    label: Maintainer
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: maintainer_name
        label:
          en: Maintainer Name
          de: Name des Verantwortlichen
        form_placeholder: Joe Bloggs

      - field_name: maintainer_email
        label:
          en: Maintainer Email
          de: E-Mail des Verantwortlichen
        form_placeholder: joe@example.com

      - field_name: phone
        label:
          en: Phone Number
          de: Telefonnummer
        display_snippet: text.html
        form_placeholder: "+49 8161 71 0000"

      - field_name: role
        label:
          en: Role
          de: Rolle
        preset: select
        display_snippet: multiple_select.html
        choices:
          - value: data_collector
            label:
              en: Data Collector
              de: Datenerfasser
          - value: expert
            label:
              en: Expert
              de: Experte
          - value: resourceProvider
            label:
              en: Resource Provider
              de: Ressourcenanbieter
          - value: custodian
            label:
              en: Custodian
              de: Verwalter
          - value: owner
            label:
              en: Owner
              de: Eigentümer
          - value: user
            label:
              en: User
              de: Benutzer
          - value: distributor
            label:
              en: Distributor
              de: Verteiler
          - value: originator
            label:
              en: Originator
              de: Urheber
          - value: pointOfContact
            label:
              en: Point of Contact
              de: Ansprechpartner
          - value: principalInvestigator
            label:
              en: Principal Investigator
              de: Hauptermittler
          - value: processor
            label:
              en: Processor
              de: Bearbeiter
          - value: publisher
            label:
              en: Publisher
              de: Herausgeber
          - value: author
            label:
              en: Author
              de: Autor
          - value: sponsor
            label:
              en: Sponsor
              de: Sponsor
          - value: coAuthor
            label:
              en: Co-Author
              de: Mitautor
          - value: collaborator
            label:
              en: Collaborator
              de: Mitarbeiter
          - value: editor
            label:
              en: Editor
              de: Redakteur
          - value: mediator
            label:
              en: Mediator
              de: Vermittler
          - value: rightsHolder
            label:
              en: Rights Holder
              de: Rechteinhaber
          - value: contributor
            label:
              en: Contributor
              de: Beitragender
          - value: funder
            label:
              en: Funder
              de: Förderer
          - value: stakeholder
            label:
              en: Stakeholder
              de: Interessenvertreter

  - field_name: owner_org
    label:
      en: Organization
      de: Organisation
    form_snippet: organization_alone.html
    help_text:
      en: Organization this catalogue entry belongs to.
      de: Legt fest welcher Organisation der Katalogeintrag zugeordnet ist.

  - field_name: owner_org
    label:
      en: Visibility
      de: Sichtbarkeit
    form_snippet: visibility.html
    help_text:
      en: Defines who can see this catalogue entry.
      de: Legt fest wer den Katalogeintrag sehen kann.

  - field_name: group
    label:
      en: Group
      de: Gruppe
    form_snippet: group.html
    display_snippet: null

  - field_name: custom-fields
    label:
      en: Custom Fields
      de: Benutzerdefiniertes Feld
    form_snippet: custom_form_fields.html

  - field_name: update_period
    label:
      en: Update Period
      de: Aktualisierungszeitraum
    validators: ignore_missing
    preset: select
    choices:
      - value: continual
        label:
          en: Continual
          de: Kontinuierlich
      - value: daily
        label:
          en: Daily
          de: Täglich
      - value: weekly
        label:
          en: Weekly
          de: Wöchentlich
      - value: fortnightly
        label:
          en: Fortnightly
          de: Vierzehntäglich
      - value: monthly
        label:
          en: Monthly
          de: Monatlich
      - value: quarterly
        label:
          en: Quarterly
          de: Vierteljährlich
      - value: biannually
        label:
          en: Biannually
          de: Halbjährlich
      - value: annually
        label:
          en: Annually
          de: Jährlich
      - value: asNeeded
        label:
          en: As Needed
          de: Bei Bedarf
      - value: irregular
        label:
          en: Irregular
          de: Unregelmäßig
      - value: notPlanned
        label:
          en: Not Planned
          de: Nicht geplant
      - value: unknown
        label:
          en: Unknown
          de: Unbekannt
      - value: periodic
        label:
          en: Periodic
          de: Periodisch
      - value: semimonthly
        label:
          en: Semimonthly
          de: Halbmonatlich
      - value: biennially
        label:
          en: Biennially
          de: Zweijährlich

  - field_name: begin_collection_date
    label:
      en: Start of Validity Period
      de: Start des Gültigkeitszeitraumes
    preset: date

  - field_name: end_collection_date
    label:
      en: End of Validity Period
      de: Ende des Gültigkeitszeitraumes
    preset: date
    help_text:
      en: Marks the validity period of this catalogue entry.
      de: Dies markiert den Gültigkeitszeitraum des Katalogeintrags.

  - field_name: spatial
    label:
      en: Spatial Extent
      de: Räumliche Ausdehnung
    form_snippet: spatial.html
    display_snippet: spatial.html
    help_text:
      en: A spatial extent (point or polygon) allows later searching by location.
      de: Über eine räumliche Ausdehnung (Punkt oder Polygon) kann später nach Katalogeinträgen gesucht werden.

  - field_name: licence_agreement
    label:
      en: Data Privacy Declaration
      de: Datenschutzerklärung
    required: True
    preset: multiple_checkbox
    choices:
      - value: licence_agreement_check
        label:
          en: I confirm that all data I have entered is covered by the license selected above.
          de: Hiermit bestätige ich, dass sämtliche von mir eingetragenen Daten unter die oben ausgewählte Lizenz fallen.

 # ---- Dataset and Documents specific fields ----

  - field_name: format
    label:
      en: Format
      de: Format
    help_text:
      en: General format or representation of the content.
      de: Allgemeines Format oder Darstellungsform des Inhalts.

  - field_name: data_type
    label:
      en: Data Type
      de: Datentyp
    form_snippet: select.html
    help_text:
      en: >
        OCL constraint: spatial data types (vector, raster, point_cloud, etc.)
        require referenceSystemType, defaultHorizontalCRS, defaultVerticalCRS,
        horizontalResolution, and verticalResolution to be filled in.
      de: >
        OCL-Einschränkung: Räumliche Datentypen (Vektor, Raster, Punktwolke usw.)
        erfordern die Angabe von Referenzsystemtyp, Standard-Horizontal-CRS,
        Standard-Vertikal-CRS, horizontaler Auflösung und vertikaler Auflösung.
    choices:
      - value: vector
        label:
          en: Vector
          de: Vektor
      - value: vector_point
        label:
          en: Vector – Point
          de: Vektor – Punkt
      - value: vector_polygon
        label:
          en: Vector – Polygon
          de: Vektor – Polygon
      - value: vector_polyline
        label:
          en: Vector – Polyline
          de: Vektor – Polylinie
      - value: vector_line
        label:
          en: Vector – Line
          de: Vektor – Linie
      - value: vector_3d
        label:
          en: Vector – 3D
          de: Vektor – 3D
      - value: point_cloud
        label:
          en: Point Cloud
          de: Punktwolke
      - value: voxel_grid
        label:
          en: Voxel Grid
          de: Voxel-Grid
      - value: mesh_3d
        label:
          en: Mesh 3D
          de: Mesh 3D
      - value: raster
        label:
          en: Raster
          de: Raster
      - value: text
        label:
          en: Text
          de: Text
      - value: image
        label:
          en: Image
          de: Bild
      - value: video
        label:
          en: Video
          de: Video
      - value: multimodal
        label:
          en: Multimodal
          de: Multimodal
      - value: tabular
        label:
          en: Tabular
          de: Tabellarisch
      - value: audio
        label:
          en: Audio
          de: Audio
      - value: other
        label:
          en: Other
          de: Sonstige

  - field_name: usage_info
    label:
      en: Usage Info
      de: Nutzungshinweise
    help_text:
      en: Information describing intended usage, limitations, or usage recommendations for the content.
      de: Informationen zur beabsichtigten Nutzung, Einschränkungen oder Nutzungsempfehlungen für den Inhalt.

  - field_name: reference_system_type
    label:
      en: Reference System Type
      de: Referenzsystemtyp
    form_snippet: select.html
    help_text:
      en: Required when dataType is a spatial type.
      de: Erforderlich, wenn der Datentyp ein räumlicher Typ ist.
    choices:
      - value: compoundEngineeringParametric
        label: Compound Engineering – Parametric
      - value: compoundEngineeringParametricTemporal
        label: Compound Engineering – Parametric Temporal
      - value: compoundEngineeringTemporal
        label: Compound Engineering – Temporal
      - value: compoundEngineeringVertical
        label: Compound Engineering – Vertical
      - value: compoundEngineeringVerticalTemporal
        label: Compound Engineering – Vertical – Temporal
      - value: compoundGeographic2DParametric
        label: Compound Geographic 2D – Parametric
      - value: compoundGeographic2DParametricTemporal
        label: Compound Geographic 2D – Parametric Temporal
      - value: compoundGeographic2DTemporal
        label: Compound Geographic 2D – Temporal
      - value: compoundGeographic2DVertical
        label: Compound Geographic 2D – Vertical
      - value: compoundGeographic2DVerticalTemporal
        label: Compound Geographic 2D – Vertical – Temporal
      - value: compoundGeographic3DTemporal
        label: Compound Geographic 3D – Temporal
      - value: compoundProjected2DParametric
        label: Compound Projected 2D – Parametric
      - value: compoundProjected2DParametricTemporal
        label: Compound Projected 2D – Parametric – Temporal
      - value: compoundProjectedTemporal
        label: Compound Projected – Temporal
      - value: compoundProjectedVertical
        label: Compound Projected – Vertical
      - value: compoundProjectedVerticalTemporal
        label: Compound Projected – Vertical – Temporal
      - value: engineering
        label: Engineering
      - value: engineeringDesign
        label: Engineering Design
      - value: engineeringImage
        label: Engineering Image
      - value: geodeticGeocentric
        label: Geodetic Geocentric
      - value: geodeticGeographic2D
        label: Geodetic Geographic 2D
      - value: geodeticGeographic3D
        label: Geodetic Geographic 3D
      - value: geographicIdentifier
        label: Geographic Identifier
      - value: linear
        label: Linear
      - value: parametric
        label: Parametric
      - value: projected
        label: Projected
      - value: temporal
        label: Temporal
      - value: vertical
        label: Vertical

  - field_name: default_horizontal_crs
    label:
      en: Default Horizontal CRS
      de: Standard-Horizontal-CRS
    help_text:
      en: "e.g. EPSG:4326, EPSG:25832. Required for spatial data types. More information can be found at https://epsg.io/."
      de: "z. B. EPSG:4326, EPSG:25832. Erforderlich für räumliche Datentypen. Weitere Informationen unter https://epsg.io/."

  - field_name: default_vertical_crs
    label:
      en: Default Vertical CRS
      de: Standard-Vertikal-CRS
    help_text:
      en: "e.g. EPSG:5783. Required for spatial data types. More information can be found at https://epsg.io/."
      de: "z. B. EPSG:5783. Erforderlich für räumliche Datentypen. Weitere Informationen unter https://epsg.io/."

  - field_name: horizontal_resolution
    label:
      en: Horizontal Resolution
      de: Horizontale Auflösung
    form_placeholder: "e.g. 1m, 10m, 1:1000, 1 pt/m²"
    help_text:
      en: Ground resolution of the dataset. Required when Data Type is a spatial type.
      de: Bodenauflösung des Datensatzes. Erforderlich, wenn der Datentyp ein räumlicher Typ ist.

  - field_name: vertical_resolution
    label:
      en: Vertical Resolution
      de: Vertikale Auflösung
    form_placeholder: "e.g. 0.1m, 0.5m, 1m"
    help_text:
      en: Vertical accuracy or height resolution of the dataset. Required for spatial data types.
      de: Vertikale Genauigkeit oder Höhenauflösung des Datensatzes. Erforderlich für räumliche Datentypen.

resource_fields:

  - field_name: url
    label: URL
    preset: resource_url_upload

  - field_name: name
    label:
      en: Name
      de: Name

  - field_name: description
    label:
      en: Description
      de: Beschreibung
    form_snippet: textarea.html

  - field_name: format
    label:
      en: Format
      de: Format
    preset: resource_format_autocomplete

  - field_name: access_url
    label:
      en: Access URL
      de: Zugriffs-URL

  - field_name: download_url
    label:
      en: Download URL
      de: Download-URL

  - field_name: content_url
    label:
      en: Content URL
      de: Inhalts-URL
    help_text:
      en: URL to the primary distribution of this dataset.
      de: URL zur primären Distribution dieses Datensatzes.

  - field_name: byte_size
    label:
      en: Byte Size
      de: Dateigröße (Bytes)
    validators: ignore_missing int_validator

  - field_name: mime_type
    label:
      en: MIME Type
      de: MIME-Typ

  - field_name: character_set
    label:
      en: Character Set
      de: Zeichensatz

  - field_name: distribution_access_rights
    label:
      en: Distribution Access Rights
      de: Zugriffsrechte
    form_snippet: select.html
    choices:
      - value: public
        label:
          en: Public
          de: Öffentlich
      - value: registered_user
        label:
          en: Registered User
          de: Registrierter Benutzer
      - value: organization_member
        label:
          en: Organization Member
          de: Organisationsmitglied
      - value: allowed_user_only
        label:
          en: Allowed Users Only
          de: Nur zugelassene Benutzer

  - field_name: allowed_users
    label:
      en: Allowed Users
      de: Berechtigte Benutzer
    preset: tag_string_autocomplete
    data-module-source: "/api/2/util/user/autocomplete?q=?"

  - field_name: issued
    label:
      en: Issued
      de: Ausgabedatum
    preset: date

  - field_name: modified
    label:
      en: Modified
      de: Änderungsdatum
    preset: date

  - field_name: license
    label:
      en: Licence
      de: Lizenz
