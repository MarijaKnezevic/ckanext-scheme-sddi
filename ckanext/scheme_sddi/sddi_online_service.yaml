scheming_version: 2
dataset_type: online-service
about: "SDDI Online Service metadata schema"
about_url: https://github.com/MarijaKnezevic/ckanext-scheme-sddi

dataset_fields:
# ============================================================
# BASE FIELDS — InformationResource (adapted from sddi_dataset.yaml style)
# ============================================================

  - field_name: title
    label:
      en: Title
      de: Titel
    preset: title
    form_placeholder: eg. A descriptive title

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: notes
    label:
      en: Description
      de: Beschreibung
    required: True
    validators: scheming_required
    form_snippet: markdown.html
    form_placeholder: eg. Some useful notes about the data

  - field_name: tag_string
    label: Tags
    required: True
    preset: tag_string_autocomplete
    validators: required_tags tag_string_convert
    form_placeholder: eg. economy, mental health, government
    help_text:
      en: Tags help others find this entry in the catalogue.
      de: Über Tags können Katalogeinträge besser gefunden werden. Ein Tag ist ein Wort, welches im Zusammenhang mit dem Eintrag steht.

  - field_name: license_id
    label:
      en: License
      de: Lizenz
    required: True
    validators: scheming_required
    form_snippet: license.html
    help_text:
      en: License definitions and additional information can be found at http://opendefinition.org/
      de: Es wird empfohlen Creative Commons Zero oder Creative Commons Namensnennung für offene Daten zu nutzen. Mehr Infos http://opendefinition.org/

  - field_name: language
    label:
      en: Language
      de: Sprache
    validators: ignore_missing
    preset: select
    choices:
      - value: de
        label: Deutsch
      - value: en
        label: English
    help_text:
      en: Language in which this catalogue entry is written.
      de: Legt fest in welcher Sprache der Katalogeintrag verfasst ist.

  - field_name: author
    label: Author
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: author_name
        label:
          en: Author Name
          de: Name des Autors
        required: True
        validators: scheming_required
        form_placeholder: Joe Bloggs

      - field_name: author_email
        label:
          en: Author Email
          de: E-Mail des Autors
        form_placeholder: joe@example.com

  - field_name: maintainer
    label: Maintainer
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: maintainer_name
        label:
          en: Maintainer Name
          de: Name des Verantwortlichen
        form_placeholder: Joe Bloggs

      - field_name: maintainer_email
        label:
          en: Maintainer Email
          de: E-Mail des Verantwortlichen
        form_placeholder: joe@example.com

      - field_name: phone
        label:
          en: Phone Number
          de: Telefonnummer
        display_snippet: text.html
        form_placeholder: "+49 8161 71 0000"

      - field_name: role
        label:
          en: Role
          de: Rolle
        preset: select
        display_snippet: multiple_select.html
        choices:
          - value: data_collector
            label:
              en: Data Collector
              de: Datenerfasser
          - value: expert
            label:
              en: Expert
              de: Experte
          - value: resourceProvider
            label:
              en: Resource Provider
              de: Ressourcenanbieter
          - value: custodian
            label:
              en: Custodian
              de: Verwalter
          - value: owner
            label:
              en: Owner
              de: Eigentümer
          - value: user
            label:
              en: User
              de: Benutzer
          - value: distributor
            label:
              en: Distributor
              de: Verteiler
          - value: originator
            label:
              en: Originator
              de: Urheber
          - value: pointOfContact
            label:
              en: Point of Contact
              de: Ansprechpartner
          - value: principalInvestigator
            label:
              en: Principal Investigator
              de: Hauptermittler
          - value: processor
            label:
              en: Processor
              de: Bearbeiter
          - value: publisher
            label:
              en: Publisher
              de: Herausgeber
          - value: author
            label:
              en: Author
              de: Autor
          - value: sponsor
            label:
              en: Sponsor
              de: Sponsor
          - value: coAuthor
            label:
              en: Co-Author
              de: Mitautor
          - value: collaborator
            label:
              en: Collaborator
              de: Mitarbeiter
          - value: editor
            label:
              en: Editor
              de: Redakteur
          - value: mediator
            label:
              en: Mediator
              de: Vermittler
          - value: rightsHolder
            label:
              en: Rights Holder
              de: Rechteinhaber
          - value: contributor
            label:
              en: Contributor
              de: Beitragender
          - value: funder
            label:
              en: Funder
              de: Förderer
          - value: stakeholder
            label:
              en: Stakeholder
              de: Interessenvertreter

  - field_name: owner_org
    label:
      en: Organization
      de: Organisation
    form_snippet: organization_alone.html
    help_text:
      en: Organization this catalogue entry belongs to.
      de: Legt fest welcher Organisation der Katalogeintrag zugeordnet ist.

  - field_name: owner_org
    label:
      en: Visibility
      de: Sichtbarkeit
    form_snippet: visibility.html
    help_text:
      en: Defines who can see this catalogue entry.
      de: Legt fest wer den Katalogeintrag sehen kann.

  - field_name: group
    label:
      en: Group
      de: Gruppe
    form_snippet: group.html
    display_snippet: null

  - field_name: custom-fields
    label:
      en: Custom Fields
      de: Benutzerdefiniertes Feld
    form_snippet: custom_form_fields.html

  - field_name: update_period
    label:
      en: Update Period
      de: Aktualisierungszeitraum
    validators: ignore_missing
    preset: select
    choices:
      - value: continual
        label:
          en: Continual
          de: Kontinuierlich
      - value: daily
        label:
          en: Daily
          de: Täglich
      - value: weekly
        label:
          en: Weekly
          de: Wöchentlich
      - value: fortnightly
        label:
          en: Fortnightly
          de: Vierzehntäglich
      - value: monthly
        label:
          en: Monthly
          de: Monatlich
      - value: quarterly
        label:
          en: Quarterly
          de: Vierteljährlich
      - value: biannually
        label:
          en: Biannually
          de: Halbjährlich
      - value: annually
        label:
          en: Annually
          de: Jährlich
      - value: asNeeded
        label:
          en: As Needed
          de: Bei Bedarf
      - value: irregular
        label:
          en: Irregular
          de: Unregelmäßig
      - value: notPlanned
        label:
          en: Not Planned
          de: Nicht geplant
      - value: unknown
        label:
          en: Unknown
          de: Unbekannt
      - value: periodic
        label:
          en: Periodic
          de: Periodisch
      - value: semimonthly
        label:
          en: Semimonthly
          de: Halbmonatlich
      - value: biennially
        label:
          en: Biennially
          de: Zweijährlich

  - field_name: begin_collection_date
    label:
      en: Start of Validity Period
      de: Start des Gültigkeitszeitraumes
    preset: date

  - field_name: end_collection_date
    label:
      en: End of Validity Period
      de: Ende des Gültigkeitszeitraumes
    preset: date
    help_text:
      en: Marks the validity period of this catalogue entry.
      de: Dies markiert den Gültigkeitszeitraum des Katalogeintrags.

  - field_name: spatial
    label:
      en: Spatial Extent
      de: Räumliche Ausdehnung
    form_snippet: spatial.html
    display_snippet: spatial.html
    help_text:
      en: A spatial extent (point or polygon) allows later searching by location.
      de: Über eine räumliche Ausdehnung (Punkt oder Polygon) kann später nach Katalogeinträgen gesucht werden.

  - field_name: licence_agreement
    label:
      en: Data Privacy Declaration
      de: Datenschutzerklärung
    required: True
    preset: multiple_checkbox
    choices:
      - value: licence_agreement_check
        label:
          en: I confirm that all data I have entered is covered by the license selected above.
          de: Hiermit bestätige ich, dass sämtliche von mir eingetragenen Daten unter die oben ausgewählte Lizenz fallen.

  # ── Online Service specific fields ───────────────────────────────────────

  - field_name: dataServiceType
    label:
      en: Data Service Type
      de: Datendiensttyp
    validators: ignore_missing
    preset: select
    choices:
      - value: discovery
        label:
          en: Discovery
          de: Suchdienst
      - value: view
        label:
          en: View
          de: Darstellungsdienst
      - value: download
        label:
          en: Download
          de: Downloaddienst
      - value: transformation
        label:
          en: Transformation
          de: Transformationsdienst
      - value: invoke
        label:
          en: Invoke
          de: Aufruf
      - value: other
        label:
          en: Other
          de: Sonstige

  - field_name: service_specification
    label:
      en: Service Specification
      de: Dienst-Spezifikation
    validators: ignore_missing
    preset: select
    choices:
      - value: OGC_WMS
        label: OGC Web Map Service (WMS)
      - value: OGC_WMTS
        label: OGC Web Map Tile Service (WMTS)
      - value: OGC_WFS
        label: OGC Web Feature Service (WFS)
      - value: OGC_WCS
        label: OGC Web Coverage Service (WCS)
      - value: OGC_WPS
        label: OGC Web Processing Service (WPS)
      - value: OGC_CSW
        label: OGC Catalogue Service for the Web (CSW)
      - value: OGC_SOS
        label: OGC Sensor Observation Service (SOS)
      - value: OGC_SPS
        label: OGC Sensor Planning Service (SPS)
      - value: OGC_API_Features
        label: OGC API – Features
      - value: OGC_API_Tiles
        label: OGC API – Tiles
      - value: OGC_API_Coverages
        label: OGC API – Coverages
      - value: OGC_API_Processes
        label: OGC API – Processes
      - value: OGC_API_Records
        label: OGC API – Records
      - value: OGC_SensorThings
        label: OGC SensorThings API
      - value: Atom_feed
        label: Atom feed (RFC 4287)
      - value: GraphQL
        label: GraphQL endpoint
      - value: REST_OpenAPI
        label: REST API (OpenAPI)
      - value: REST_undocumented
        label: REST API (undocumented)
      - value: SOAP
        label: SOAP web service (W3C SOAP)
      - value: SPARQL
        label: SPARQL endpoint (W3C SPARQL 1.1 Protocol)
      - value: SQL
        label: SQL query service (ISO/IEC 9075)
      - value: MQTT
        label: MQTT
      - value: RPC
        label: RPC service
      - value: other
        label:
          en: Other
          de: Sonstige
      - value: other_open
        label:
          en: Other (Open)
          de: Sonstige (Offen)
      - value: other_not_open
        label:
          en: Other (Not Open)
          de: Sonstige (Nicht offen)
      - value: other_non_commercial
        label:
          en: Other (Non-Commercial)
          de: Sonstige (Nicht kommerziell)

  - field_name: service_specification_version
    label:
      en: Service Specification Version
      de: Version der Dienst-Spezifikation
    validators: ignore_missing
    form_placeholder: e.g. WMS 1.3.0

  - field_name: protocol
    label:
      en: Protocol
      de: Protokoll
    validators: ignore_missing
    preset: select
    choices:
      - value: HTTP
        label: HTTP
      - value: HTTPS
        label: HTTPS
      - value: WebSocket
        label: WebSocket
      - value: SOAP
        label: SOAP
      - value: RPC
        label: RPC
      - value: GraphQL
        label: GraphQL
      - value: MQTT
        label: MQTT
      - value: AMQP
        label: AMQP
      - value: STOMP
        label: STOMP
      - value: CoAP
        label: CoAP
      - value: Other
        label:
          en: Other
          de: Sonstige

  - field_name: protocol_request
    label:
      en: Protocol Request
      de: Protokollanfrage
    validators: ignore_missing
    form_placeholder: e.g. GetMap, GetFeature
    help_text:
      en: Template or description of the request pattern used for the protocol (e.g., query parameters, headers).
      de: Vorlage oder Beschreibung des Anfrage-Musters für das Protokoll (z. B. Abfrageparameter, Header).

  - field_name: operations_metadata
    label:
      en: Operations Metadata
      de: Operationen-Metadaten
    validators: ignore_missing
    form_snippet: markdown.html
    help_text:
      en: Reference to operations metadata (e.g., capabilities document, OpenAPI spec location) or textual description of supported operations.
      de: Verweis auf Operationen-Metadaten (z. B. Capabilities-Dokument, OpenAPI-Spezifikation) oder textuelle Beschreibung der unterstützten Operationen.

  - field_name: service_provider
    label:
      en: Service Provider
      de: Dienstanbieter
    validators: ignore_missing
    form_placeholder: e.g. Landesamt für Digitalisierung Bayern
    help_text:
      en: Name of the organization or entity providing the service.
      de: Name der Organisation oder Stelle, die den Dienst bereitstellt.

  - field_name: fees
    label:
      en: Fees
      de: Gebühren
    validators: ignore_missing
    form_placeholder: "e.g. 0.00"

  - field_name: security
    label:
      en: Security
      de: Sicherheit
    validators: ignore_missing
    form_placeholder: e.g. OAuth2, API Key
    help_text:
      en: Security requirements and mechanisms (e.g., TLS, OAuth2, API key, certificates).
      de: Sicherheitsanforderungen und -mechanismen (z. B. TLS, OAuth2, API-Schlüssel, Zertifikate).

  - field_name: data_type
    label:
      en: Data Type
      de: Datentyp
    validators: ignore_missing
    preset: select
    choices:
      - value: vector
        label:
          en: Vector
          de: Vektor
      - value: vector_point
        label:
          en: Vector – Point
          de: Vektor – Punkt
      - value: vector_polygon
        label:
          en: Vector – Polygon
          de: Vektor – Polygon
      - value: vector_polyline
        label:
          en: Vector – Polyline
          de: Vektor – Polylinie
      - value: vector_line
        label:
          en: Vector – Line
          de: Vektor – Linie
      - value: vector_3d
        label:
          en: Vector – 3D
          de: Vektor – 3D
      - value: point_cloud
        label:
          en: Point Cloud
          de: Punktwolke
      - value: voxel_grid
        label:
          en: Voxel Grid
          de: Voxel-Grid
      - value: mesh_3d
        label:
          en: Mesh 3D
          de: Mesh 3D
      - value: raster
        label:
          en: Raster
          de: Raster
      - value: text
        label:
          en: Text
          de: Text
      - value: image
        label:
          en: Image
          de: Bild
      - value: video
        label:
          en: Video
          de: Video
      - value: multimodal
        label:
          en: Multimodal
          de: Multimodal
      - value: tabular
        label:
          en: Tabular
          de: Tabellarisch
      - value: audio
        label:
          en: Audio
          de: Audio
      - value: Other
        label:
          en: Other
          de: Sonstige

  - field_name: http_method
    label:
      en: HTTP Method
      de: HTTP-Methode
    validators: ignore_missing
    preset: select
    choices:
      - value: GET
        label: GET
      - value: POST
        label: POST
      - value: PUT
        label: PUT
      - value: PATCH
        label: PATCH
      - value: DELETE
        label: DELETE
      - value: HEAD
        label: HEAD
      - value: OPTIONS
        label: OPTIONS
      - value: TRACE
        label: TRACE

  - field_name: endpoint_path
    label:
      en: Endpoint Path
      de: Endpunkt-Pfad
    validators: ignore_missing
    form_placeholder: e.g. /collections/buildings

resource_fields:

  - field_name: url
    label: URL
    preset: resource_url_upload

  - field_name: name
    label:
      en: Name
      de: Name

  - field_name: description
    label:
      en: Description
      de: Beschreibung
    form_snippet: textarea.html

  - field_name: linkage
    label:
      en: Service Endpoint URL
      de: Dienst-Endpunkt-URL
    validators: ignore_missing
    form_placeholder: https://example.com/wms

  - field_name: externalDocs
    label:
      en: External Documents URL
      de: URL externer Dokumente
    form_placeholder: https://example.com/documentation

  - field_name: open_api_document
    label:
      en: OpenAPI Document URL
      de: OpenAPI-Dokument-URL
    validators: ignore_missing
    form_placeholder: https://example.com/openapi.json

  - field_name: format
    label:
      en: Format
      de: Format
    preset: resource_format_autocomplete

  - field_name: access_url
    label:
      en: Access URL
      de: Zugriffs-URL

  - field_name: download_url
    label:
      en: Download URL
      de: Download-URL

  - field_name: byte_size
    label:
      en: Byte Size
      de: Dateigröße (Bytes)
    validators: ignore_missing int_validator

  - field_name: mime_type
    label:
      en: MIME Type
      de: MIME-Typ

  - field_name: character_set
    label:
      en: Character Set
      de: Zeichensatz

  - field_name: distribution_access_rights
    label:
      en: Distribution Access Rights
      de: Zugriffsrechte
    form_snippet: select.html
    choices:
      - value: public
        label:
          en: Public
          de: Öffentlich
      - value: registered_user
        label:
          en: Registered User
          de: Registrierter Benutzer
      - value: organization_member
        label:
          en: Organization Member
          de: Organisationsmitglied
      - value: allowed_user_only
        label:
          en: Allowed Users Only
          de: Nur zugelassene Benutzer

  - field_name: allowed_users
    label:
      en: Allowed Users
      de: Berechtigte Benutzer
    preset: tag_string_autocomplete
    data-module-source: "/api/2/util/user/autocomplete?q=?"

  - field_name: issued
    label:
      en: Issued
      de: Ausgabedatum
    preset: date

  - field_name: modified
    label:
      en: Modified
      de: Änderungsdatum
    preset: date

  - field_name: license
    label:
      en: Licence
      de: Lizenz