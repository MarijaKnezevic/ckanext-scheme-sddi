scheming_version: 2
dataset_type: digital-twin
about: "SDDI Digital Twin metadata schema"
about_url: https://github.com/MarijaKnezevic/ckanext-scheme-sddi

dataset_fields:
# ============================================================
# BASE FIELDS — InformationResource (adapted from sddi_dataset.yaml style)
# ============================================================

  - field_name: title
    label: Title
    preset: title
    form_placeholder: eg. A descriptive title

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: notes
    label:
      en: Description
      de: Beschreibung
    required: True
    validators: scheming_required
    form_snippet: markdown.html
    form_placeholder: eg. Some useful notes about the data

  - field_name: tag_string
    label: Tags
    required: True
    preset: tag_string_autocomplete
    validators: required_tags tag_string_convert
    form_placeholder: eg. economy, mental health, government
    help_text:
      en: Tags help others find this entry in the catalogue.
      de: Über Tags können Katalogeinträge besser gefunden werden. Ein Tag ist ein Wort, welches im Zusammenhang mit dem Eintrag steht.

  - field_name: license_id
    label:
      en: License
      de: Lizenz
    required: True
    validators: scheming_required
    form_snippet: license.html
    help_text:
      en: License definitions and additional information can be found at http://opendefinition.org/
      de: Es wird empfohlen Creative Commons Zero oder Creative Commons Namensnennung für offene Daten zu nutzen. Mehr Infos http://opendefinition.org/

  - field_name: language
    label:
      en: Language
      de: Sprache
    validators: ignore_missing
    preset: select
    choices:
      - value: de
        label: Deutsch
      - value: en
        label: English
    help_text:
      en: Language in which this catalogue entry is written.
      de: Legt fest in welcher Sprache der Katalogeintrag verfasst ist.

  - field_name: author
    label: Author
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: author_name
        label:
          en: Author Name
          de: Name des Autors
        required: True
        validators: scheming_required
        form_placeholder: Joe Bloggs

      - field_name: author_email
        label:
          en: Author Email
          de: E-Mail des Autors
        form_placeholder: joe@example.com

  - field_name: maintainer
    label: Maintainer
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: maintainer_name
        label:
          en: Maintainer Name
          de: Name des Verantwortlichen
        form_placeholder: Joe Bloggs

      - field_name: maintainer_email
        label:
          en: Maintainer Email
          de: E-Mail des Verantwortlichen
        form_placeholder: joe@example.com

      - field_name: phone
        label:
          en: Phone Number
          de: Telefonnummer
        display_snippet: text.html
        form_placeholder: "+49 8161 71 0000"

      - field_name: role
        label:
          en: Role
          de: Rolle
        preset: select
        display_snippet: multiple_select.html
        choices:
          - value: data_collector
            label:
              en: Data Collector
              de: Datenerfasser
          - value: expert
            label:
              en: Expert
              de: Experte
          - value: resourceProvider
            label:
              en: Resource Provider
              de: Ressourcenanbieter
          - value: custodian
            label:
              en: Custodian
              de: Verwalter
          - value: owner
            label:
              en: Owner
              de: Eigentümer
          - value: user
            label:
              en: User
              de: Benutzer
          - value: distributor
            label:
              en: Distributor
              de: Verteiler
          - value: originator
            label:
              en: Originator
              de: Urheber
          - value: pointOfContact
            label:
              en: Point of Contact
              de: Ansprechpartner
          - value: principalInvestigator
            label:
              en: Principal Investigator
              de: Hauptermittler
          - value: processor
            label:
              en: Processor
              de: Bearbeiter
          - value: publisher
            label:
              en: Publisher
              de: Herausgeber
          - value: author
            label:
              en: Author
              de: Autor
          - value: sponsor
            label:
              en: Sponsor
              de: Sponsor
          - value: coAuthor
            label:
              en: Co-Author
              de: Mitautor
          - value: collaborator
            label:
              en: Collaborator
              de: Mitarbeiter
          - value: editor
            label:
              en: Editor
              de: Redakteur
          - value: mediator
            label:
              en: Mediator
              de: Vermittler
          - value: rightsHolder
            label:
              en: Rights Holder
              de: Rechteinhaber
          - value: contributor
            label:
              en: Contributor
              de: Beitragender
          - value: funder
            label:
              en: Funder
              de: Förderer
          - value: stakeholder
            label:
              en: Stakeholder
              de: Interessenvertreter

  - field_name: owner_org
    label:
      en: Organization
      de: Organisation
    form_snippet: organization_alone.html
    help_text:
      en: Organization this catalogue entry belongs to.
      de: Legt fest welcher Organisation der Katalogeintrag zugeordnet ist.

  - field_name: owner_org
    label:
      en: Visibility
      de: Sichtbarkeit
    form_snippet: visibility.html
    help_text:
      en: Defines who can see this catalogue entry.
      de: Legt fest wer den Katalogeintrag sehen kann.

  - field_name: group
    label:
      en: Group
      de: Gruppe
    form_snippet: group.html
    display_snippet: null

  - field_name: custom-fields
    label:
      en: Custom Fields
      de: Benutzerdefiniertes Feld
    form_snippet: custom_form_fields.html

  - field_name: update_period
    label:
      en: Update Period
      de: Aktualisierungszeitraum
    validators: ignore_missing
    preset: select
    choices:
      - value: continual
        label:
          en: Continual
          de: Kontinuierlich
      - value: daily
        label:
          en: Daily
          de: Täglich
      - value: weekly
        label:
          en: Weekly
          de: Wöchentlich
      - value: fortnightly
        label:
          en: Fortnightly
          de: Vierzehntäglich
      - value: monthly
        label:
          en: Monthly
          de: Monatlich
      - value: quarterly
        label:
          en: Quarterly
          de: Vierteljährlich
      - value: biannually
        label:
          en: Biannually
          de: Halbjährlich
      - value: annually
        label:
          en: Annually
          de: Jährlich
      - value: asNeeded
        label:
          en: As Needed
          de: Bei Bedarf
      - value: irregular
        label:
          en: Irregular
          de: Unregelmäßig
      - value: notPlanned
        label:
          en: Not Planned
          de: Nicht geplant
      - value: unknown
        label:
          en: Unknown
          de: Unbekannt
      - value: periodic
        label:
          en: Periodic
          de: Periodisch
      - value: semimonthly
        label:
          en: Semimonthly
          de: Halbmonatlich
      - value: biennially
        label:
          en: Biennially
          de: Zweijährlich

  - field_name: begin_collection_date
    label:
      en: Start of Validity Period
      de: Start des Gültigkeitszeitraumes
    preset: date

  - field_name: end_collection_date
    label:
      en: End of Validity Period
      de: Ende des Gültigkeitszeitraumes
    preset: date
    help_text:
      en: Marks the validity period of this catalogue entry.
      de: Dies markiert den Gültigkeitszeitraum des Katalogeintrags.

  - field_name: spatial
    label:
      en: Spatial Extent
      de: Räumliche Ausdehnung
    form_snippet: spatial.html
    display_snippet: spatial.html
    help_text:
      en: A spatial extent (point or polygon) allows later searching by location.
      de: Über eine räumliche Ausdehnung (Punkt oder Polygon) kann später nach Katalogeinträgen gesucht werden.

  - field_name: licence_agreement
    label:
      en: Data Privacy Declaration
      de: Datenschutzerklärung
    required: True
    preset: multiple_checkbox
    choices:
      - value: licence_agreement_check
        label:
          en: I confirm that all data I have entered is covered by the license selected above.
          de: Hiermit bestätige ich, dass sämtliche von mir eingetragenen Daten unter die oben ausgewählte Lizenz fallen.

  # ── Digital Twin specific fields ─────────────────────────────────────────

  - field_name: function
    label:
      en: Function
      de: Funktion
    validators: ignore_missing
    form_snippet: markdown.html
    help_text:
      en: Description of the main purpose and intended function of the digital twin.
      de: Beschreibung des Hauptzwecks und der beabsichtigten Funktion des digitalen Zwillings.

  - field_name: lifecycle_status
    label:
      en: Lifecycle Status
      de: Lebenszyklusstatus
    validators: ignore_missing
    preset: select
    choices:
      - value: concept
        label:
          en: Concept
          de: Konzept
      - value: design
        label:
          en: Design
          de: Entwurf
      - value: development
        label:
          en: Development
          de: Entwicklung
      - value: testing
        label:
          en: Testing
          de: Test
      - value: operational
        label:
          en: Operational
          de: In Betrieb
      - value: maintenance
        label:
          en: Maintenance
          de: Wartung
      - value: deprecated
        label:
          en: Deprecated
          de: Veraltet
      - value: suspended
        label:
          en: Suspended
          de: Ausgesetzt
      - value: pilot
        label:
          en: Pilot
          de: Pilot
      - value: archived
        label:
          en: Archived
          de: Archiviert
      - value: prototype
        label:
          en: Prototype
          de: Prototyp
      - value: planned
        label:
          en: Planned
          de: Geplant
      - value: approved
        label:
          en: Approved
          de: Genehmigt
      - value: released
        label:
          en: Released
          de: Veröffentlicht
      - value: experimental
        label:
          en: Experimental
          de: Experimentell

  - field_name: contents
    label:
      en: Contents
      de: Inhalte
    validators: ignore_missing
    form_snippet: markdown.html
    help_text:
      en: Description or reference to the contents/components included in the digital twin (e.g., datasets, models, services).
      de: Beschreibung oder Verweis auf die im digitalen Zwilling enthaltenen Inhalte/Komponenten (z. B. Datensätze, Modelle, Dienste).

  - field_name: modeled_entity
    label:
      en: Modeled Entity
      de: Modellierte Entität
    validators: ignore_missing
    form_placeholder: e.g. Building Lot 5, City District Maxvorstadt
    help_text:
      en: The real-world object, system, or process this twin represents.
      de: Das reale Objekt, System oder der Prozess, den dieser Zwilling repräsentiert.

  - field_name: static_attributes
    label:
      en: Static Attributes
      de: Statische Attribute
    validators: ignore_missing
    form_snippet: textarea.html
    help_text:
      en: Fixed attributes of the modeled entity.
      de: Unveränderliche Attribute der modellierten Entität.

  - field_name: dynamic_attributes
    label:
      en: Dynamic Attributes
      de: Dynamische Attribute
    validators: ignore_missing
    form_snippet: textarea.html
    help_text:
      en: Time-varying attributes updated from sensors or simulations.
      de: Zeitlich veränderliche Attribute, die von Sensoren oder Simulationen aktualisiert werden.

  - field_name: open_data_availability
    label:
      en: Open Data Availability
      de: Open-Data-Verfügbarkeit
    validators: ignore_missing
    form_snippet: markdown.html
    help_text:
      en: Description of which data layers are publicly accessible.
      de: Beschreibung, welche Datenschichten öffentlich zugänglich sind.

resource_fields:
  - field_name: url
    label: URL
    preset: resource_url_upload

  - field_name: name
    label:
      en: Name
      de: Name
    form_placeholder: eg. January 2011 Gold Prices

  - field_name: description
    label:
      en: Description
      de: Beschreibung
    form_snippet: markdown.html
    form_placeholder: Some useful notes about the data

  - field_name: format
    label:
      en: Format
      de: Format
    required: True
    preset: resource_format_autocomplete

  - field_name: access_url
    label:
      en: Access URL
      de: Zugriffs-URL
    validators: ignore_missing
    form_placeholder: https://example.com

  - field_name: download_url
    label:
      en: Download URL
      de: Download-URL
    validators: ignore_missing
    form_placeholder: https://example.com

  - field_name: byte_size
    label:
      en: Byte Size
      de: Dateigröße (Bytes)
    validators: ignore_missing int_validator

  - field_name: mime_type
    label:
      en: MIME Type
      de: MIME-Typ
    validators: ignore_missing
    form_placeholder: e.g. application/json

  - field_name: character_set
    label:
      en: Character Set
      de: Zeichensatz
    validators: ignore_missing
    form_placeholder: e.g. UTF-8

  - field_name: issued
    label:
      en: Issued
      de: Ausgabedatum
    preset: date
    validators: ignore_missing

  - field_name: modified
    label:
      en: Modified
      de: Änderungsdatum
    preset: date
    validators: ignore_missing

  - field_name: restricted_level
    label:
      en: Distribution Access Rights
      de: Zugriffsrechte
    validators: scheming_required
    preset: select
    form_include_blank_choice: False
    required: True
    choices:
      - value: public
        label:
          en: Public
          de: Öffentlich
      - value: registered
        label:
          en: Registered Users
          de: Registrierte Benutzer
      - value: same_organization
        label:
          en: Members of the Same Organization
          de: Mitglieder der selben Organisation
      - value: only_allowed_users
        label:
          en: Allowed Users Only
          de: Nur ausgewählte Benutzer
    help_text:
      en: Defines who has access to this resource.
      de: Legt fest, wer Zugriff auf die Ressource hat.

  - field_name: allowed_users
    label:
      en: Allowed Users
      de: Berechtigte Benutzer
    preset: tag_string_autocomplete
    data-module-source: "/api/2/util/user/autocomplete?q=?"
