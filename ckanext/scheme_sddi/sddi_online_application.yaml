scheming_version: 2
dataset_type: online-application
about: "SDDI Online Application metadata schema"
about_url: https://github.com/MarijaKnezevic/ckanext-scheme-sddi

dataset_fields:

  # ---- InformationResource base fields (shared across all types) ----
  - field_name: title
    label:
      en: Title
      de: Titel
    preset: title
    form_placeholder: eg. A descriptive title

  - field_name: name
    label: URL
    preset: dataset_slug
    form_placeholder: eg. my-dataset

  - field_name: notes
    label:
      en: Description
      de: Beschreibung
    required: True
    validators: scheming_required
    form_snippet: markdown.html
    form_placeholder: eg. Some useful notes about the data

  - field_name: tag_string
    label: Tags
    required: True
    preset: tag_string_autocomplete
    validators: required_tags tag_string_convert
    form_placeholder: eg. economy, mental health, government
    help_text:
      en: Tags help others find this entry in the catalogue.
      de: Über Tags können Katalogeinträge besser gefunden werden. Ein Tag ist ein Wort, welches im Zusammenhang mit dem Eintrag steht.

  - field_name: license_id
    label:
      en: License
      de: Lizenz
    required: True
    validators: scheming_required
    form_snippet: license.html
    help_text:
      en: License definitions and additional information can be found at http://opendefinition.org/
      de: Es wird empfohlen Creative Commons Zero oder Creative Commons Namensnennung für offene Daten zu nutzen. Mehr Infos http://opendefinition.org/

  - field_name: language
    label:
      en: Language
      de: Sprache
    validators: ignore_missing
    preset: select
    choices:
      - value: de
        label: Deutsch
      - value: en
        label: English
    help_text:
      en: Language in which this catalogue entry is written.
      de: Legt fest in welcher Sprache der Katalogeintrag verfasst ist.

  - field_name: author
    label: Author
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: author_name
        label:
          en: Author Name
          de: Name des Autors
        required: True
        validators: scheming_required
        form_placeholder: Joe Bloggs

      - field_name: author_email
        label:
          en: Author Email
          de: E-Mail des Autors
        form_placeholder: joe@example.com

  - field_name: maintainer
    label: Maintainer
    form_blanks: 1
    preset: composite_repeating
    subfields:
      - field_name: maintainer_name
        label:
          en: Maintainer Name
          de: Name des Verantwortlichen
        form_placeholder: Joe Bloggs

      - field_name: maintainer_email
        label:
          en: Maintainer Email
          de: E-Mail des Verantwortlichen
        form_placeholder: joe@example.com

      - field_name: phone
        label:
          en: Phone Number
          de: Telefonnummer
        display_snippet: text.html
        form_placeholder: "+49 8161 71 0000"

      - field_name: role
        label:
          en: Role
          de: Rolle
        preset: select
        display_snippet: multiple_select.html
        choices:
          - value: data_collector
            label:
              en: Data Collector
              de: Datenerfasser
          - value: expert
            label:
              en: Expert
              de: Experte
          - value: resourceProvider
            label:
              en: Resource Provider
              de: Ressourcenanbieter
          - value: custodian
            label:
              en: Custodian
              de: Verwalter
          - value: owner
            label:
              en: Owner
              de: Eigentümer
          - value: user
            label:
              en: User
              de: Benutzer
          - value: distributor
            label:
              en: Distributor
              de: Verteiler
          - value: originator
            label:
              en: Originator
              de: Urheber
          - value: pointOfContact
            label:
              en: Point of Contact
              de: Ansprechpartner
          - value: principalInvestigator
            label:
              en: Principal Investigator
              de: Hauptermittler
          - value: processor
            label:
              en: Processor
              de: Bearbeiter
          - value: publisher
            label:
              en: Publisher
              de: Herausgeber
          - value: author
            label:
              en: Author
              de: Autor
          - value: sponsor
            label:
              en: Sponsor
              de: Sponsor
          - value: coAuthor
            label:
              en: Co-Author
              de: Mitautor
          - value: collaborator
            label:
              en: Collaborator
              de: Mitarbeiter
          - value: editor
            label:
              en: Editor
              de: Redakteur
          - value: mediator
            label:
              en: Mediator
              de: Vermittler
          - value: rightsHolder
            label:
              en: Rights Holder
              de: Rechteinhaber
          - value: contributor
            label:
              en: Contributor
              de: Beitragender
          - value: funder
            label:
              en: Funder
              de: Förderer
          - value: stakeholder
            label:
              en: Stakeholder
              de: Interessenvertreter

  - field_name: owner_org
    label:
      en: Organization
      de: Organisation
    form_snippet: organization_alone.html
    help_text:
      en: Organization this catalogue entry belongs to.
      de: Legt fest welcher Organisation der Katalogeintrag zugeordnet ist.

  - field_name: owner_org
    label:
      en: Visibility
      de: Sichtbarkeit
    form_snippet: visibility.html
    help_text:
      en: Defines who can see this catalogue entry.
      de: Legt fest wer den Katalogeintrag sehen kann.

  - field_name: group
    label:
      en: Group
      de: Gruppe
    form_snippet: group.html
    display_snippet: null

  - field_name: update_period
    label:
      en: Update Period
      de: Aktualisierungszeitraum
    validators: ignore_missing
    preset: select
    choices:
      - value: continual
        label:
          en: Continual
          de: Kontinuierlich
      - value: daily
        label:
          en: Daily
          de: Täglich
      - value: weekly
        label:
          en: Weekly
          de: Wöchentlich
      - value: fortnightly
        label:
          en: Fortnightly
          de: Vierzehntäglich
      - value: monthly
        label:
          en: Monthly
          de: Monatlich
      - value: quarterly
        label:
          en: Quarterly
          de: Vierteljährlich
      - value: biannually
        label:
          en: Biannually
          de: Halbjährlich
      - value: annually
        label:
          en: Annually
          de: Jährlich
      - value: asNeeded
        label:
          en: As Needed
          de: Bei Bedarf
      - value: irregular
        label:
          en: Irregular
          de: Unregelmäßig
      - value: notPlanned
        label:
          en: Not Planned
          de: Nicht geplant
      - value: unknown
        label:
          en: Unknown
          de: Unbekannt
      - value: periodic
        label:
          en: Periodic
          de: Periodisch
      - value: semimonthly
        label:
          en: Semimonthly
          de: Halbmonatlich
      - value: biennially
        label:
          en: Biennially
          de: Zweijährlich

  - field_name: begin_collection_date
    label:
      en: Start of Validity Period
      de: Start des Gültigkeitszeitraumes
    preset: date

  - field_name: end_collection_date
    label:
      en: End of Validity Period
      de: Ende des Gültigkeitszeitraumes
    preset: date
    help_text:
      en: Marks the validity period of this catalogue entry.
      de: Dies markiert den Gültigkeitszeitraum des Katalogeintrags.

  - field_name: spatial
    label:
      en: Spatial Extent
      de: Räumliche Ausdehnung
    form_snippet: spatial.html
    display_snippet: spatial.html
    help_text:
      en: A spatial extent (point or polygon) allows later searching by location.
      de: Über eine räumliche Ausdehnung (Punkt oder Polygon) kann später nach Katalogeinträgen gesucht werden.

  - field_name: custom-fields
    label:
      en: Custom Fields
      de: Benutzerdefiniertes Feld
    form_snippet: custom_form_fields.html

  # ── Online Application specific fields ───────────────────────────────────

  - field_name: hosted_by
    label:
      en: Hosted By
      de: Gehostet von
    validators: ignore_missing
    form_placeholder: e.g. AWS, TU Munich HPC
    help_text:
      en: Organization or platform hosting the online application.
      de: Organisation oder Plattform, auf der die Online-Anwendung gehostet wird.

  - field_name: servers
    label:
      en: Servers
      de: Server
    validators: ignore_missing
    form_placeholder: e.g. https://app.example.com

  - field_name: security
    label:
      en: Security
      de: Sicherheit
    validators: ignore_missing
    form_placeholder: e.g. OAuth2, API Key, Basic Auth

  - field_name: variables
    label:
      en: Variables
      de: Variablen
    validators: ignore_missing
    form_snippet: textarea.html
    help_text:
      en: Variables used or exposed by the application (e.g., configuration or runtime variables).
      de: Von der Anwendung verwendete oder bereitgestellte Variablen (z. B. Konfigurations- oder Laufzeitvariablen).

  - field_name: parameters
    label:
      en: Parameters
      de: Parameter
    validators: ignore_missing
    form_snippet: textarea.html
    help_text:
      en: Parameters accepted or required by the application (e.g., request or configuration parameters).
      de: Von der Anwendung akzeptierte oder benötigte Parameter (z. B. Anfrage- oder Konfigurationsparameter).

  - field_name: supported_format
    label:
      en: Supported Formats
      de: Unterstützte Formate
    validators: ignore_missing
    form_placeholder: e.g. GeoJSON, CSV, GeoTIFF

  - field_name: web_standard
    label:
      en: Web Standard
      de: Webstandard
    validators: ignore_missing
    preset: select
    choices:
      - value: HTML
        label: HTML
      - value: CSS3
        label: CSS3
      - value: HTTP
        label: HTTP
      - value: OpenAPI
        label: OpenAPI Specification
      - value: WSDL
        label: Web Services Description Language (WSDL)
      - value: Other
        label:
          en: Other
          de: Sonstige

  - field_name: conformance
    label:
      en: Conformance
      de: Konformität
    validators: ignore_missing
    form_snippet: textarea.html
    help_text:
      en: Reference to conformance declarations or standards this application conforms to (e.g., OGC conformance classes, API standards).
      de: Verweis auf Konformitätserklärungen oder Standards, denen diese Anwendung entspricht (z. B. OGC-Konformitätsklassen, API-Standards).

  # ── Distribution ─────────────────────────────────────────────────────────────
  - field_name: has_external_docs
    label:
      en: Does this entry have External Documentation?
      de: Hat diese Anwendung eine externe Dokumentation?
    validators: ignore_missing
    preset: select
    choices:
      - value: "yes"
        label:
          en: "Yes"
          de: "Ja"
      - value: "no"
        label:
          en: "No"
          de: "Nein"
    help_text:
      en: If yes, a resource named "External Documentation" will be created in the next step.
      de: Falls ja, wird im nächsten Schritt eine Ressource namens „Externe Dokumentation" erstellt.

  - field_name: has_service_doc
    label:
      en: Does this entry have a Service Documentation?
      de: Hat diese Anwendung eine Dienst-Dokumentation?
    validators: ignore_missing
    preset: select
    choices:
      - value: "yes"
        label:
          en: "Yes"
          de: "Ja"
      - value: "no"
        label:
          en: "No"
          de: "Nein"
    help_text:
      en: If yes, a resource named "Service Documentation" will be created in the next step.
      de: Falls ja, wird im nächsten Schritt eine Ressource namens „Dienst-Dokumentation" erstellt.

# ── Declaration — must be confirmed before submitting ────────────────────
  - field_name: licence_agreement
    label:
      en: Data Privacy Declaration
      de: Datenschutzerklärung
    required: True
    preset: multiple_checkbox
    choices:
      - value: licence_agreement_check
        label:
          en: I confirm that all data I have entered is covered by the license selected above.
          de: Hiermit bestätige ich, dass sämtliche von mir eingetragenen Daten unter die oben ausgewählte Lizenz fallen.

resource_fields:

  - field_name: url
    label: URL
    preset: resource_url_upload

  - field_name: name
    label:
      en: Name
      de: Name

  - field_name: description
    label:
      en: Description
      de: Beschreibung
    form_snippet: textarea.html

  - field_name: format
    label:
      en: Format
      de: Format
    preset: resource_format_autocomplete

  - field_name: size
    label:
      en: Byte Size
      de: Dateigröße (Bytes)
    validators: ignore_missing
    display_snippet: text.html
    form_snippet: null

  - field_name: mime_type
    label:
      en: MIME Type
      de: MIME-Typ

  - field_name: character_set
    label:
      en: Character Set
      de: Zeichensatz

  - field_name: restricted_level
    label: Zugriffsrechte
    validators: ignore_missing
    preset: select
    choices:
      - value: public
        label: Öffentlich
      - value: registered
        label: Registrierte Benutzer
      - value: same_organization
        label: Mitglieder der selben Organisation
      - value: only_allowed_users
        label: Nur ausgewählte Benutzer
    help_text: Legt fest, wer Zugriff auf die Ressource hat.

  - field_name: allowed_users
    label: Allowed Users
    validators: ignore_missing
    preset: tag_string_autocomplete
    data-module-source: "/api/2/util/user/autocomplete?q=?"

  - field_name: license
    label:
      en: Licence
      de: Lizenz

